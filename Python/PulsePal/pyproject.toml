[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsepal"
version = "3.0.0"
description = "Python interface for PulsePal device control"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.4",
    "numpy>=1.22.0",
]

[tool.setuptools]
py-modules = ["PulsePal"]
